name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # esl CI-guard idea: the tag must match every synced version file
      - name: Verify versions match tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in VERSION; do
            [ "$(cat $f)" = "$TAG" ] || { echo "::error::$f=$(cat $f) != $TAG"; exit 1; }
          done
          M=$(jq -r .version custom_components/remote_mapper/manifest.json)
          [ "$M" = "$TAG" ] || { echo "::error::manifest.json=$M != $TAG"; exit 1; }
          P=$(jq -r .version custom_components/remote_mapper/frontend/package.json)
          [ "$P" = "$TAG" ] || { echo "::error::package.json=$P != $TAG"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custom_components/remote_mapper/frontend/package-lock.json

      - name: Build frontend
        working-directory: custom_components/remote_mapper/frontend
        run: |
          npm ci
          npm run build

      - name: Committed build must match
        run: git diff --exit-code custom_components/remote_mapper/www

      # HACS downloads this asset (hacs.json: zip_release + filename), so
      # ship runtime files only. The exclusion list lives in
      # scripts/package.sh and tests/test_packaging.py guards it.
      - name: Zip integration
        run: |
          scripts/package.sh remote_mapper.zip
          unzip -l remote_mapper.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: remote_mapper.zip
          generate_release_notes: true

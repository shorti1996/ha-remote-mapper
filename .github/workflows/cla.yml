name: CLA

# Contributor License Agreement check (CLA Assistant Lite). Signatures are
# stored in this repository under .github/cla/signatures.json; a PR from an
# unsigned contributor gets a comment with the signing instructions.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # The repo owner's own PRs (including commits written for them by tools)
    # need no CLA.
    if: >-
      (github.event.pull_request.user.login || github.event.issue.user.login)
      != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla/signatures.json"
          path-to-document: "https://github.com/shorti1996/ha-remote-mapper/blob/master/CLA.md"
          branch: "master"
          allowlist: shorti1996,dependabot[bot]

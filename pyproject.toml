[project]
name = "ha-remote-mapper"
version = "0.1.2"
description = "Home Assistant integration turning physical remotes into first-class dashboard objects"
requires-python = ">=3.14.2"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.346",
    # PHACC does not ship hass_frontend; needed because manifest depends on frontend
    "home-assistant-frontend",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
